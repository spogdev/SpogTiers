plugins {
	id 'fabric-loom' version "${loom_version}"
	id 'maven-publish'
}

version = "${project.mod_version}+${project.minecraft_version}"
group = project.maven_group

base {
	archivesName = project.archives_base_name
}

repositories {
	// Fabric's repositories are added by Loom automatically.
	exclusiveContent {
		forRepository {
			maven {
				name = "Modrinth"
				url = "https://api.modrinth.com/maven"
			}
		}
		filter {
			includeGroup "maven.modrinth"
		}
	}

	// SporeUI, the shared config UI. One artifact per Minecraft version, so
	// each branch of this mod depends on the matching one.
	maven {
		name = "Spog"
		url = "https://repo.spog.dev/releases"
		content {
			includeGroup "dev.spog"
		}
	}
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	// Minecraft 26.x ships DEOBFUSCATED: Mojang publishes no mappings file for
	// it and Fabric's intermediary is an empty 0.0.0 stub. There is nothing to
	// remap, so feed Loom an empty mapping set and code against the names that
	// are already in the jar.
	mappings files("mappings/identity-mappings.jar")
	modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"

	modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

	// ModMenu is only needed to compile the config-screen entrypoint; the mod
	// runs fine without it, so it is not bundled or required at runtime.
	modCompileOnly "maven.modrinth:modmenu:${project.modmenu_version}"

	// Loaded in the dev client only, so runClient has a mod list to open the
	// config screen from. localRuntime keeps it out of the published jar and
	// off the compile classpath, so what ships is unchanged.
	modLocalRuntime "maven.modrinth:modmenu:${project.modmenu_version}"

	// The shared config UI: the tabbed settings screen and the widgets that
	// fill it, which this mod's settings screen is built from. Bundled with
	//  so a player installs this mod alone -- it is a library nobody
	// would think to install separately, and it is small.
	//
	// transitive = false for the same reason ModMenu is declared on its own
	// above: SporeUI exposes ModMenuApi to its dependents, and without this
	// the two declarations fight over which ModMenu version wins.
	modImplementation("dev.spog:sporeui:${project.sporeui_version}") { transitive = false }
	include("dev.spog:sporeui:${project.sporeui_version}")

}

processResources {
	inputs.property "version", project.version
	inputs.property "minecraft_version", project.minecraft_version
	inputs.property "loader_version", project.loader_version

	filesMatching("fabric.mod.json") {
		expand "version": project.version,
				"minecraft_version": project.minecraft_version,
				"loader_version": project.loader_version
	}
}

def targetJavaVersion = 25

tasks.withType(JavaCompile).configureEach {
	it.options.encoding = "UTF-8"
	it.options.release.set(targetJavaVersion)
}

java {
	def javaVersion = JavaVersion.toVersion(targetJavaVersion)
	if (JavaVersion.current() < javaVersion) {
		toolchain.languageVersion = JavaLanguageVersion.of(targetJavaVersion)
	}
	// Loom will attach sources to the decompiled Minecraft jar.
	withSourcesJar()
}

jar {
	from("LICENSE") {
		rename { "${it}_${project.base.archivesName.get()}" }
	}
}

// Collect the built jar into a top-level dist/ folder so every version branch
// drops its output in the same place. Named per MC version, so jars from
// different branches sit side by side instead of overwriting each other.
def distDir = rootProject.layout.projectDirectory.dir("dist")

tasks.register('copyToDist', Copy) {
	group = 'build'
	description = 'Copies the remapped jar into dist/.'

	// from(task) already carries the dependency; declaring the output as an
	// input too keeps up-to-date checks honest, so a rebuilt jar with the same
	// name is still copied instead of being skipped as UP-TO-DATE.
	from tasks.named('remapJar').flatMap { it.archiveFile }
	into distDir
}

tasks.named('build') {
	finalizedBy 'copyToDist'
}

tasks.register('cleanDist', Delete) {
	group = 'build'
	description = "Removes this version's jars from dist/."
	delete fileTree(distDir) {
		include "${project.base.archivesName.get()}-*${project.minecraft_version}*.jar"
	}
}

// Surface mixin application failures loudly in dev runs.
loom {
	runs {
		configureEach {
			// 26.x jars ship deobfuscated, so the loader defaults its runtime
			// namespace to 'official'. Fabric API's class tweakers are authored
			// in 'named' and the loader refuses to read them across namespaces.
			// The two are identical here (identity mappings), so pin the runtime
			// namespace to 'named'.
			vmArg "-Dfabric.runtimeMappingNamespace=named"
			vmArg "-Dmixin.debug.verify=true"
			vmArg "-Dmixin.debug.export=true"
			vmArg "-Dmixin.checks.interfaces=true"
		}
	}
}

// Every name in the mixin config must have a matching source file, and every
// mixin source must be listed. A mismatch is only caught at launch otherwise,
// as a mod that fails to load with no compile error -- and cherry-picking
// between the mojmap and yarn branches renames these files, so it happens.
tasks.register('checkMixinConfig') {
	group = 'verification'
	description = 'Cross-checks the mixin config against the mixin sources.'

	def config = file('src/main/resources/spogtiers.client.mixins.json')
	def dir = file('src/main/java/dev/spog/tiers/mixin')
	inputs.file(config)
	inputs.dir(dir)

	doLast {
		def listed = new groovy.json.JsonSlurper().parse(config).client as Set
		def present = dir.listFiles()
				.findAll { it.name.endsWith('.java') }
				.collect { it.name - '.java' } as Set

		def missing = listed - present
		def unlisted = present - listed
		if (missing) {
			throw new GradleException("mixin config lists classes that do not exist: ${missing}")
		}
		if (unlisted) {
			throw new GradleException("mixin sources missing from the config: ${unlisted}")
		}
	}
}

tasks.named('check') {
	dependsOn 'checkMixinConfig'
}

// A client gametest that opens the settings screen and paints every tab in a
// real client. The screen is drawn inside extractRenderState, which the
// compiler checks and never runs, so this is what actually proves the port
// works rather than merely compiles.
fabricApi {
	configureTests {
		createSourceSet = true
		modId = "spogtiers-gametest"
		enableClientGameTests = true
		// A client mod: there is no server behaviour to test.
		enableGameTests = false
	}
}

dependencies {
	// Fabric API on the gametest source set's own classpath: the test is
	// driven by fabric-client-gametest-api-v1. modGametestImplementation, not
	// the plain configuration -- this branch remaps, and leaving Fabric API
	// unremapped puts its class tweakers in a different namespace from the
	// loader's, which fails at startup rather than at compile time.
	modGametestImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
}
