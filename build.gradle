plugins {
	id 'fabric-loom' version "${loom_version}"
	id 'maven-publish'
}

version = "${project.mod_version}+${project.minecraft_version}"
group = project.maven_group

base {
	archivesName = project.archives_base_name
}

repositories {
	// ModMenu is only on Modrinth's maven, and exclusiveContent keeps every
	// other lookup off it.
	exclusiveContent {
		forRepository {
			maven { url = "https://api.modrinth.com/maven" }
		}
		filter { includeGroup "maven.modrinth" }
	}
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
	modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"

	modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

	// Compile-only: the config screen is optional, so ModMenu is not shipped
	// as a hard dependency.
	modCompileOnly "maven.modrinth:modmenu:${project.modmenu_version}"
}

processResources {
	inputs.property "version", project.version
	inputs.property "minecraft_version", project.minecraft_version
	inputs.property "loader_version", project.loader_version

	filesMatching("fabric.mod.json") {
		expand "version": project.version,
				"minecraft_version": project.minecraft_version,
				"loader_version": project.loader_version
	}
}

def targetJavaVersion = 21

tasks.withType(JavaCompile).configureEach {
	it.options.encoding = "UTF-8"
	it.options.release.set(targetJavaVersion)
}

java {
	def javaVersion = JavaVersion.toVersion(targetJavaVersion)
	if (JavaVersion.current() < javaVersion) {
		toolchain.languageVersion = JavaLanguageVersion.of(targetJavaVersion)
	}
	// Loom will attach sources to the decompiled Minecraft jar.
	withSourcesJar()
}

jar {
	from("LICENSE") {
		rename { "${it}_${project.base.archivesName.get()}" }
	}
}

// Collect the built jar into a top-level dist/ folder so every version branch
// drops its output in the same place. Named per MC version, so jars from
// different branches sit side by side instead of overwriting each other.
def distDir = rootProject.layout.projectDirectory.dir("dist")

tasks.register('copyToDist', Copy) {
	group = 'build'
	description = 'Copies the remapped jar into dist/.'
	dependsOn tasks.named('remapJar')

	from tasks.named('remapJar')
	into distDir
}

tasks.named('build') {
	finalizedBy 'copyToDist'
}

tasks.register('cleanDist', Delete) {
	group = 'build'
	description = "Removes this version's jars from dist/."
	delete fileTree(distDir) {
		include "${project.base.archivesName.get()}-*mc${project.minecraft_version}*.jar"
	}
}

// Surface mixin application failures loudly in dev runs.
loom {
	runs {
		configureEach {
			vmArg "-Dmixin.debug.verify=true"
			vmArg "-Dmixin.debug.export=true"
			vmArg "-Dmixin.checks.interfaces=true"
		}
	}
}

// Every name in the mixin config must have a matching source file, and every
// mixin source must be listed. A mismatch is only caught at launch otherwise,
// as a mod that fails to load with no compile error -- and cherry-picking
// between the mojmap and yarn branches renames these files, so it happens.
tasks.register('checkMixinConfig') {
	group = 'verification'
	description = 'Cross-checks the mixin config against the mixin sources.'

	def config = file('src/main/resources/spogtiers.client.mixins.json')
	def dir = file('src/main/java/dev/spog/tiers/mixin')
	inputs.file(config)
	inputs.dir(dir)

	doLast {
		def listed = new groovy.json.JsonSlurper().parse(config).client as Set
		def present = dir.listFiles()
				.findAll { it.name.endsWith('.java') }
				.collect { it.name - '.java' } as Set

		def missing = listed - present
		def unlisted = present - listed
		if (missing) {
			throw new GradleException("mixin config lists classes that do not exist: ${missing}")
		}
		if (unlisted) {
			throw new GradleException("mixin sources missing from the config: ${unlisted}")
		}
	}
}

tasks.named('check') {
	dependsOn 'checkMixinConfig'
}
