name: build

on:
  push:
    branches: [ "**" ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The backend targets 25; the mod branches target 21. This branch has no
      # mod source, so only 25 is needed here.
      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build and test
        run: ./gradlew :backend:build --stacktrace

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: doorsmp-backend
          path: backend/build/libs/*-all.jar
