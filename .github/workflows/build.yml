name: build

# A compile check across every branch, not a release process. The branches are
# parallel variants of the same mod, so uploading a jar from each would leave
# one artifact per branch per push -- copies of the same thing. Releases are
# published deliberately from dist/ instead.

on:
  push:
    branches: [ "**" ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build
        run: ./gradlew build --stacktrace

